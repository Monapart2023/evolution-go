name: Build and Publish Docker Image (Mon Apart fork)

# Fork da Mon Apart: evolution-go 0.7.2 + whatsmeow atualizado (WhatsApp recusava
# a versao antiga com "Client outdated (405)" em 02/11/2026). Publica no GHCR.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Resolve deps and compile
        run: |
          go mod tidy
          go build ./...
          go vet ./cmd/... || true

      - name: go.mod/go.sum must already be tidy (commit them before pushing)
        run: git diff --exit-code -- go.mod go.sum

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)-monapart" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/monapart2023/evolution-go:${{ steps.version.outputs.version }}
            ghcr.io/monapart2023/evolution-go:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
